[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aes_gcm_file_crypter"
dynamic = ["version"]
description = "A CLI for securely encrypting or decrypting files and/or entire folders using AES-GCM cryptography with basic forensic recovery-prevention features."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Joel Horensma" }
]
requires-python = ">=3.8"
dependencies = [
    "cryptography>=42.0.0",
    "psutil",
    "colorama; platform_system=='Windows'",
]

[project.scripts]
aes_gcm_file_crypter = "aes_gcm_file_crypter.__main__:main"

[tool.setuptools]
packages = [
    "aes_gcm_file_crypter",
    "aes_gcm_file_crypter.src",
]

[tool.setuptools.dynamic]
version = { attr = "aes_gcm_file_crypter.__version__" }

[tool.setuptools.package-data]
aes_gcm_file_crypter = [
    "assets/icon/ico/*",
    "assets/icon/png/*",
]
